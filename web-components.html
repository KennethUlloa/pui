<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components | PUI Design System</title>
    <link rel="stylesheet" href="./dist/css/index.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="navbar">
      <div class="navbar-inner">
        <a href="./" class="navbar-brand">PUI <span class="navbar-brand-divider">/</span> Design system</a>
        <nav aria-label="Main navigation" class="navbar-links">
          <a href="./" class="navbar-link">Foundations</a>
          <a href="./components.html" class="navbar-link">Components</a>
          <a href="./web-components.html" class="navbar-link" aria-current="page">Web Components</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-9 px-3 pt-8 pb-9">
      <section class="mb-8">
        <p class="text-cyan-700 text-0 font-bold uppercase">PUI / 03</p>
        <h1 class="text-8 font-bold leading-tight text-balance mt-1">Web Components</h1>
        <p class="text-gray-600 max-w-prose mt-2 text-3 leading-relaxed text-pretty">A working view of the controls and feedback patterns in the PUI system.</p>
      </section>

      <section class="mb-8">
        <div class="flex items-center justify-between gap-2 mb-2">
          <h2 class="text-5 font-semibold">Datatable</h2>
          <span class="text-1 text-gray-500">Example and usage</span>
        </div>
        <div class="border border-gray-200 rounded-3 bg-white p-4 grid gap-4">
            <div class="border border-gray-200 rounded-3">
                <div class="flex items-center justify-between gap-2 mb-2">
                    <div class="input-container m-1">
                        <svg class="text-gray-400" width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="inherit" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        <input type="text" placeholder="Search..." id="search">
                    </div>
                </div>
                <pui-datatable checkable striped hoverable id="datatable"></pui-datatable>
                <pui-pagination id="pagination" pagesize="10" totalitems="135"></pui-pagination>
            </div>
        </div>
      </section>

      <section class="mb-8">
        <div class="flex items-center justify-between gap-2 mb-2">
          <h2 class="text-5 font-semibold">Searchbar</h2>
          <span class="text-1 text-gray-500">Example and usage</span>
        </div>
        <div class="border border-gray-200 rounded-3 bg-white p-4 gap-4">
            <div class="border border-gray-200 rounded-3">
                <pui-searchbar id="searchbar"></pui-searchbar>
            </div>
            <span class="chip chip-2 mt-1" id="selected"></span>
        </div>
      </section>
    </main>
    <script type="module" src="./src/pages/web-components.ts"></script>
  </body>
</html>
