<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components | PUI Design System</title>
    <link rel="stylesheet" href="./dist/css/index.css" />
  </head>
  <body class="bg-gray-50 text-gray-900 font-sans">
    <header class="bg-white border-b border-gray-200">
      <div class="mx-auto max-w-6xl px-lg py-md flex items-center justify-between gap-md">
        <a href="./" class="text-lg font-bold text-gray-900 no-underline">PUI <span class="text-cyan-700">/</span> Design system</a>
        <nav aria-label="Main navigation" class="flex items-center gap-lg text-sm font-semibold">
          <a href="./" class="text-gray-600 no-underline hover-bg-gray-100 px-sm py-xs rounded-sm">Foundations</a>
          <a href="./components.html" class="text-cyan-800 no-underline" aria-current="page">Components</a>
          <a href="./web-components.html" class="text-cyan-800 no-underline" aria-current="page">Web Components</a>
        </nav>
      </div>
    </header>

    <main class="mx-auto max-w-6xl px-lg pt-5xl pb-6xl">
      <section class="mb-5xl">
        <p class="text-cyan-700 text-xs font-bold uppercase">PUI / 03</p>
        <h1 class="text-5xl font-bold leading-tight text-balance mt-sm">Web Components</h1>
        <p class="text-gray-600 max-w-prose mt-md text-lg leading-relaxed text-pretty">A working view of the controls and feedback patterns in the PUI system.</p>
      </section>

      <section class="mb-5xl">
        <div class="flex items-center justify-between gap-md mb-md">
          <h2 class="text-2xl font-semibold">Datatable</h2>
          <span class="text-sm text-gray-500">Example and usage</span>
        </div>
        <div class="border border-gray-200 rounded-lg bg-white p-xl grid gap-xl">
            <div class="border border-gray-200 rounded-lg">
                <div class="flex items-center justify-between gap-md mb-md">
                    <div class="input-container m-sm">
                        <svg class="text-gray-400" width="1.5em" height="1.5em" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor"><g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M15.7955 15.8111L21 21M18 10.5C18 14.6421 14.6421 18 10.5 18C6.35786 18 3 14.6421 3 10.5C3 6.35786 6.35786 3 10.5 3C14.6421 3 18 6.35786 18 10.5Z" stroke="inherit" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path> </g></svg>
                        <input type="text" placeholder="Search..." id="search">
                    </div>
                </div>
                <pui-datatable checkable striped hoverable id="datatable"></pui-datatable>
                <pui-pagination id="pagination" pagesize="10" totalitems="135"></pui-pagination>
            </div>
        </div>
      </section>

      <section class="mb-5xl">
        <div class="flex items-center justify-between gap-md mb-md">
          <h2 class="text-2xl font-semibold">Searchbar</h2>
          <span class="text-sm text-gray-500">Example and usage</span>
        </div>
        <div class="border border-gray-200 rounded-lg bg-white p-xl gap-xl">
            <div class="border border-gray-200 rounded-lg">
                <pui-searchbar id="searchbar"></pui-searchbar>
            </div>
            <span class="chip chip-lg mt-sm" id="selected"></span>
        </div>
      </section>
    </main>
    <script type="module" src="./src/pages/web-components.ts"></script>
  </body>
</html>
